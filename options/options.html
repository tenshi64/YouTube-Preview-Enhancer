<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Preview Enhancer - Options</title>
    <link rel="stylesheet" href="./options.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="side-by-side">
        <img src="../images/icon.png" alt="logo">
        <h1><span id="small">YouTube</span><br>Preview Enhancer</h1>
    </div>
    <div class="version">
        <span id="left">Version 1.1.0</span>
        <span id="right">Made by tenshi</span>
    </div><br>
    <hr>
    <div class="navigation">
        <a href="https://discord.com/invite/nKyz5KZwTM" target="_blank">Contact me</a>
        <a href="https://github.com/tenshi64/YouTube-Preview-Enhancer" target="_blank">GitHub Page</a>
    </div>
    <hr>
    <div>
        <h3>Options:</h3>
        <input type="checkbox" id="disable-mute" checked>
        <label for="disable-mute">Disable Preview Auto-Mute</label><br>
        <input type="checkbox" id="disable-cc" checked>
        <label for="disable-cc">Disable Preview Closed Captions</label>
        <script src="./options.js"></script>
    </div>
</body>
</html>
